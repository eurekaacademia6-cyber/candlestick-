name: Build CandleVision APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build CandleVision APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Check Java
        run: |
          java -version

      - name: Check Gradle
        run: |
          gradle --version

      - name: Check project structure
        run: |
          echo "=== Repository root ==="
          ls -la
          echo ""
          echo "=== Source files ==="
          find . -maxdepth 2 -type f \
            \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "build.gradle" -o -name "settings.gradle" \) \
            -print | sort

      - name: Clean project
        run: |
          gradle clean

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandleVisionExpert-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
          if-no-files-found: error
